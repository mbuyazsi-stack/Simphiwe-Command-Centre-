<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Command Centre</title>
<style>
  :root {
    --navy: #0C2545;
    --coral: #F47B6A;
    --cream: #FBF7F4;
    --ink: #1E2A3A;
    --purple: #7C5CB8;
    --green: #2E6E4E;
    --gold: #C08A2D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .header { background: var(--navy); color: white; padding: 28px 20px 16px; }
  .date { color: var(--coral); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 4px; }
  .title { font-size: 21px; font-weight: 700; margin: 0; font-family: Georgia, serif; }
  .tagline { font-size: 12px; opacity: 0.72; margin: 8px 0 0; }
  .link-btn { background: none; border: none; color: white; font-size: 12px; text-decoration: underline; opacity: 0.6; padding: 0; margin-top: 10px; cursor: pointer; display: block; }
  .backup-panel { background: white; padding: 16px 20px; border-bottom: 1px solid rgba(12,37,69,0.12); }
  .backup-panel h3 { font-size: 12px; color: var(--navy); margin: 0 0 6px; }
  .backup-panel textarea { width: 100%; font-family: monospace; font-size: 11px; padding: 8px; border-radius: 8px; border: 1px solid rgba(12,37,69,0.3); color: var(--ink); resize: vertical; }
  .backup-err { font-size: 12px; color: var(--coral); margin: 4px 0 0; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px; position: sticky; top: 0; background: var(--cream); z-index: 5; }
  .tab { flex-shrink: 0; font-size: 12px; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(12,37,69,0.15); background: white; color: var(--navy); cursor: pointer; white-space: nowrap; }
  .tab.active { background: var(--navy); color: white; border-color: var(--navy); }
  .tab .count { opacity: 0.55; margin-left: 3px; }
  .tab.active .count { color: var(--coral); opacity: 1; }
  .body { padding: 4px 20px 150px; }
  .banner { border-radius: 12px; padding: 15px; margin-bottom: 14px; }
  .banner.err { background: #FEE2E2; border: 1px solid #FCA5A5; }
  .banner.err .b-title { color: #991B1B; font-size: 13px; font-weight: 600; margin: 0 0 4px; }
  .banner.err .b-body { color: #991B1B; font-size: 12px; margin: 0; }
  .task-row { display: flex; align-items: flex-start; gap: 11px; padding: 8px 0; cursor: pointer; }
  .task-row.indent { margin-left: 24px; }
  .checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--navy); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; margin-top: 1px; color: white; font-size: 11px; }
  .checkbox.round { border-radius: 999px; }
  .task-body { flex: 1; min-width: 0; }
  .task-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .task-title { font-size: 14px; }
  .task-title.done { text-decoration: line-through; opacity: 0.4; }
  .time-badge { font-size: 11px; font-weight: 700; color: var(--coral); font-family: monospace; }
  .meta-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
  .cat-dot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; display: inline-block; }
  .meta-txt { font-size: 11px; opacity: 0.5; }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0 6px 31px; }
  .chip { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--navy); color: var(--navy); background: white; cursor: pointer; }
  .chip.prio { border-color: var(--coral); color: var(--coral); }
  .chip.goal { border-color: var(--purple); color: var(--purple); }
  .chip.danger { border-color: #fca5a5; color: #ef4444; }
  .cat-section { margin-bottom: 18px; }
  .cat-head { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; }
  .cat-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--navy); margin: 0; font-weight: 700; }
  .cat-head .n { font-size: 11px; opacity: 0.4; }
  .empty { font-size: 12px; opacity: 0.45; text-align: center; padding: 30px 0; }
  .goal-row { margin-bottom: 12px; }
  .goal-title { font-size: 14px; font-weight: 600; margin: 0; }
  .goal-title.done { text-decoration: line-through; opacity: 0.4; }
  .goal-note { font-size: 12px; opacity: 0.62; margin: 3px 0 0; }
  .goal-days { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
  .goal-linked { font-size: 12px; opacity: 0.85; margin: 0 0 8px 31px; padding-left: 14px; }
  .goal-linked li { padding: 2px 0; list-style: disc; }
  .goals-intro { font-size: 12px; opacity: 0.5; margin: 0 0 16px; }
  .horizon-head { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 4px; }
  .horizon-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--navy); margin: 0; font-weight: 700; }
  .horizon-head .sub { font-size: 11px; opacity: 0.4; }
  .capture-bar { position: fixed; left: 0; right: 0; bottom: 0; background: white; border-top: 1px solid rgba(12,37,69,0.12); padding: 12px 16px; }
  .capture-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .capture-row input { flex: 1; font-size: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(12,37,69,0.3); color: var(--ink); }
  .capture-row button.add { background: var(--coral); color: white; border: none; border-radius: 10px; padding: 0 18px; font-size: 14px; font-weight: 600; }
  .chip-row { display: flex; gap: 6px; overflow-x: auto; }
  .cat-chip { flex-shrink: 0; font-size: 11px; padding: 5px 11px; border-radius: 999px; white-space: nowrap; border: none; cursor: pointer; }
  .close-chip { font-size: 11px; padding: 5px 11px; opacity: 0.5; background: none; border: none; }
  .capture-toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .capture-toggle { flex: 1; text-align: left; background: rgba(12,37,69,0.06); border: none; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: rgba(30,42,58,0.55); cursor: pointer; }
  .save-indicator { font-size: 11px; margin-left: 10px; border: none; background: none; padding: 0; white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // ---------- constants ----------
  var CATEGORIES = {
    practice: { label: "Practice", color: "var(--coral)" },
    ventures: { label: "Ventures", color: "var(--navy)" },
    imbali: { label: "NPO Board", color: "var(--purple)" },
    eskom: { label: "Employer", color: "var(--green)" },
    life: { label: "Life", color: "var(--gold)" }
  };
  var HORIZONS = {
    short: { label: "Short-term", sub: "next 6 weeks", color: "var(--coral)" },
    medium: { label: "Medium-term", sub: "the transition", color: "var(--navy)" },
    long: { label: "Long-term", sub: "the practice", color: "var(--gold)" }
  };
  var BUCKETS = {
    today: "Today", week: "This Week", nextWeek: "Next Week", month: "This Month",
    backlog: "Later", waiting: "Waiting For", someday: "Someday"
  };
  var TABS = [
    ["now", "Now"], ["today", "Today"], ["tomorrow", "Tomorrow"], ["goals", "Goals"], ["week", "Week"], ["nextWeek", "Next Wk"],
    ["month", "Month"], ["all", "All"], ["waiting", "Waiting"], ["someday", "Someday"], ["done", "Done"]
  ];
  var DEPTH_META = {
    light: { label: "Light / admin", emoji: "\u2600\uFE0F", color: "var(--gold)" },
    deep: { label: "Deep / build", emoji: "\uD83C\uDF19", color: "var(--purple)" }
  };
  var PRIORITIES = [null, "must", "should", "could"];
  var PRIORITY_META = {
    must: { dot: "\uD83D\uDD34", label: "Must do" },
    should: { dot: "\uD83D\uDFE0", label: "Should do" },
    could: { dot: "\uD83D\uDFE2", label: "Could do" }
  };
  var TASKS_KEY = "scc_tasks_v2_fresh";
  var GOALS_KEY = "scc_goals_v2_fresh";

  function mkTask(id, title, category, opts) {
    opts = opts || {};
    return {
      id: id, title: title, category: category,
      parentId: opts.parentId || null,
      bucket: opts.bucket || "backlog",
      priority: opts.priority || null,
      time: opts.time || null,
      goalId: opts.goalId || null,
      depth: opts.depth || null,
      date: opts.date || null,
      done: opts.done || false
    };
  }
  function mkGoal(id, title, horizon, opts) {
    opts = opts || {};
    return {
      id: id, title: title, horizon: horizon,
      deadline: opts.deadline || null,
      note: opts.note || "",
      category: opts.category || null,
      done: false
    };
  }

  var SEED_GOALS = [];

  var SEED_TASKS = [];

  // ---------- state ----------
  var DEPTH_MIGRATION_KEY = "scc_depth_migration_v2_fresh";
  var DEPTH_MAP = {
    b2: "light", p1: "deep", p2: "deep", p3: "deep", p4: "light", p5: "deep",
    p6: "deep", p7: "deep", p8: "deep", p9: "deep", p10: "light", p11: "light",
    p12: "deep", p13: "deep", p14: "deep", p15: "light", p16: "deep",
    v1: "deep", v2: "deep", v3: "deep", v4: "deep", v5: "light", v6: "light",
    v7: "light", v8: "deep", v9: "deep", v10: "light", v11: "deep", v12: "deep",
    v13: "deep", v14: "light", v15: "light", v16: "deep", v17: "deep",
    v18: "light", v19: "light", v20: "light", v21: "light", i1: "light", i2: "light"
  };

  var state = {
    tasks: [],
    goals: [],
    view: "now",
    expanded: null,
    showAdd: false,
    newTitle: "",
    newCat: "practice",
    newHorizon: "short",
    showBackup: false,
    restoreText: "",
    restoreError: "",
    saveState: "idle",
    loadError: null
  };
  var idCounter = 1000;
  function nid() { return "t" + Date.now() + "_" + (idCounter++); }
  function ngid() { return "g" + Date.now() + "_" + (idCounter++); }

  // ---------- persistence (real localStorage \u2014 not the artifact sandbox API) ----------
  function load() {
    try {
      var raw = localStorage.getItem(TASKS_KEY);
      state.tasks = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED_TASKS));
    } catch (e) {
      state.loadError = String(e && e.message ? e.message : e);
      state.tasks = JSON.parse(JSON.stringify(SEED_TASKS));
    }
    try {
      var rawG = localStorage.getItem(GOALS_KEY);
      state.goals = rawG ? JSON.parse(rawG) : JSON.parse(JSON.stringify(SEED_GOALS));
    } catch (e) {
      if (!state.loadError) state.loadError = String(e && e.message ? e.message : e);
      state.goals = JSON.parse(JSON.stringify(SEED_GOALS));
    }
    try {
      if (!localStorage.getItem(DEPTH_MIGRATION_KEY)) {
        var changed = false;
        state.tasks.forEach(function (t) {
          if (DEPTH_MAP[t.id] && !t.depth) { t.depth = DEPTH_MAP[t.id]; changed = true; }
        });
        localStorage.setItem(DEPTH_MIGRATION_KEY, "applied");
        if (changed) { localStorage.setItem(TASKS_KEY, JSON.stringify(state.tasks)); }
      }
    } catch (e) { /* non-fatal */ }
  }
  function save() {
    state.saveState = "saving";
    try {
      localStorage.setItem(TASKS_KEY, JSON.stringify(state.tasks));
      localStorage.setItem(GOALS_KEY, JSON.stringify(state.goals));
      state.saveState = "saved";
      render();
      setTimeout(function () { state.saveState = "idle"; render(); }, 1200);
      return;
    } catch (e) {
      state.saveState = "error";
    }
  }

  // ---------- helpers ----------
  function findTask(id) { for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i]; return null; }
  function findGoal(id) { for (var i = 0; i < state.goals.length; i++) if (state.goals[i].id === id) return state.goals[i]; return null; }
  function openTasks() { return state.tasks.filter(function (t) { return !t.done; }); }
  function ymd(d) {
    var y = d.getFullYear(), m = ("0" + (d.getMonth() + 1)).slice(-2), day = ("0" + d.getDate()).slice(-2);
    return y + "-" + m + "-" + day;
  }
  function todayStr() { return ymd(new Date()); }
  function tomorrowStr() { var d = new Date(); d.setDate(d.getDate() + 1); return ymd(d); }
  function taskDateStatus(t) {
    if (!t.date) return null;
    var td = todayStr(), tm = tomorrowStr();
    if (t.date === td) return "today";
    if (t.date === tm) return "tomorrow";
    if (t.date < td) return "today"; // missed its day \u2014 surfaces in Today rather than vanishing
    return "future";
  }
  function effectiveBucket(t) {
    var ds = taskDateStatus(t);
    if (ds === "today" || ds === "tomorrow") return ds;
    return t.bucket;
  }
  function itemsForBucket(bucket) {
    return openTasks().filter(function (t) { return effectiveBucket(t) === bucket; });
  }
  function scheduleTomorrow(id) { var t = findTask(id); if (!t) return; t.date = tomorrowStr(); t.bucket = "today"; save(); render(); }
  function clearDate(id) { var t = findTask(id); if (!t) return; t.date = null; save(); render(); }

  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var target = new Date(dateStr + "T00:00:00");
    var today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((target - today) / 86400000);
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function prioRank(p) { return p === "must" ? 0 : p === "should" ? 1 : p === "could" ? 2 : 3; }
  function getContext() {
    var now = new Date();
    var day = now.getDay(); // 0=Sun..6=Sat
    var mins = now.getHours() * 60 + now.getMinutes();
    if (day === 5) return { mode: "light", label: "Friday \u2014 light, admin & review time" };
    if (day === 6) {
      if (mins >= 19 * 60 && mins < 22 * 60 + 30) return { mode: "deep", label: "Saturday evening \u2014 deep / build / creative time" };
      return { mode: "sabbath", label: "Sabbath \u2014 full rest, no work" };
    }
    if (day === 0 && mins >= 10 * 60 && mins < 13 * 60) return { mode: "deep", label: "Sunday morning \u2014 strategy time" };
    return null;
  }
  function timeToMin(str) { if (!str) return null; var parts = str.split(":"); return (+parts[0]) * 60 + (+parts[1]); }
  function sortTasks(arr) {
    return arr.slice().sort(function (a, b) {
      var ta = timeToMin(a.time), tb = timeToMin(b.time);
      if (ta !== null && tb !== null) return ta - tb;
      if (ta !== null) return -1;
      if (tb !== null) return 1;
      return prioRank(a.priority) - prioRank(b.priority);
    });
  }

  // ---------- mutations ----------
  function toggleDone(id) { var t = findTask(id); if (!t) return; t.done = !t.done; save(); render(); }
  function patchTask(id, patch) { var t = findTask(id); if (!t) return; for (var k in patch) t[k] = patch[k]; save(); render(); }
  function removeTask(id) {
    var doomed = {}; doomed[id] = true;
    state.tasks.forEach(function (t) { if (t.parentId === id) doomed[t.id] = true; });
    state.tasks = state.tasks.filter(function (t) { return !doomed[t.id]; });
    state.expanded = null; save(); render();
  }
  function addTask() {
    var title = state.newTitle.trim();
    if (!title) return;
    if (state.view === "tomorrow") {
      state.tasks.push(mkTask(nid(), title, state.newCat, { bucket: "today", date: tomorrowStr() }));
    } else {
      var bucket = state.view === "now" ? "today" : (BUCKETS[state.view] ? state.view : "backlog");
      state.tasks.push(mkTask(nid(), title, state.newCat, { bucket: bucket }));
    }
    state.newTitle = ""; save(); render();
  }
  function cyclePriority(id) {
    var t = findTask(id); if (!t) return;
    var idx = PRIORITIES.indexOf(t.priority);
    t.priority = PRIORITIES[(idx + 1) % PRIORITIES.length];
    save(); render();
  }
  function cycleGoal(id) {
    var t = findTask(id); if (!t) return;
    var ids = [null].concat(state.goals.map(function (g) { return g.id; }));
    var idx = ids.indexOf(t.goalId);
    t.goalId = ids[(idx + 1) % ids.length];
    save(); render();
  }
  function cycleDepth(id) {
    var t = findTask(id); if (!t) return;
    var order = [null, "light", "deep"];
    var idx = order.indexOf(t.depth);
    t.depth = order[(idx + 1) % order.length];
    save(); render();
  }
  function cycleCategory(id) {
    var t = findTask(id); if (!t) return;
    var keys = Object.keys(CATEGORIES);
    var idx = keys.indexOf(t.category);
    t.category = keys[(idx + 1) % keys.length];
    save(); render();
  }
  function toggleGoalDone(id) { var g = findGoal(id); if (!g) return; g.done = !g.done; save(); render(); }
  function removeGoal(id) { state.goals = state.goals.filter(function (g) { return g.id !== id; }); state.expanded = null; save(); render(); }
  function addGoal() {
    var title = state.newTitle.trim();
    if (!title) return;
    state.goals.push(mkGoal(ngid(), title, state.newHorizon));
    state.newTitle = ""; save(); render();
  }
  function restoreBackup() {
    try {
      var parsed = JSON.parse(state.restoreText);
      if (!parsed.tasks && !parsed.goals) throw new Error("no data");
      if (parsed.tasks) state.tasks = parsed.tasks;
      if (parsed.goals) state.goals = parsed.goals;
      state.restoreText = ""; state.restoreError = ""; state.showBackup = false;
      save(); render();
    } catch (e) {
      state.restoreError = "That doesn't look like a valid backup \u2014 check you copied the whole thing.";
      render();
    }
  }

  // ---------- render ----------
  function catDot(cat) { return '<span class="cat-dot" style="background:' + (CATEGORIES[cat] ? CATEGORIES[cat].color : "var(--navy)") + '"></span>'; }

  function taskActionsHtml(t) {
    var out = '<div class="actions">';
    Object.keys(BUCKETS).forEach(function (key) {
      if (t.bucket === key) return;
      out += '<button class="chip" data-action="move-task" data-id="' + t.id + '" data-bucket="' + key + '">\u2192 ' + BUCKETS[key] + '</button>';
    });
    var pm = t.priority ? (PRIORITY_META[t.priority].dot + " " + PRIORITY_META[t.priority].label) : "Set priority";
    out += '<button class="chip prio" data-action="cycle-priority" data-id="' + t.id + '">' + pm + "</button>";
    var catMeta = CATEGORIES[t.category];
    out += '<button class="chip" style="border-color:' + catMeta.color + ";color:" + catMeta.color + '" data-action="cycle-category" data-id="' + t.id + '">' + catMeta.label + " \u21bb</button>";
    var linkedGoal = t.goalId ? findGoal(t.goalId) : null;
    var gm = linkedGoal ? ("\u2192 " + esc(linkedGoal.title.slice(0, 24))) : "Link to goal";
    out += '<button class="chip goal" data-action="cycle-goal" data-id="' + t.id + '">' + gm + "</button>";
    var dm = t.depth ? (DEPTH_META[t.depth].emoji + " " + DEPTH_META[t.depth].label) : "Tag light/deep";
    out += '<button class="chip" style="border-color:' + (t.depth ? DEPTH_META[t.depth].color : "var(--navy)") + ";color:" + (t.depth ? DEPTH_META[t.depth].color : "var(--navy)") + '" data-action="cycle-depth" data-id="' + t.id + '">' + dm + "</button>";
    out += '<button class="chip danger" data-action="delete-task" data-id="' + t.id + '">Delete</button>';
    if (effectiveBucket(t) !== "tomorrow") {
      out += '<button class="chip" data-action="schedule-tomorrow" data-id="' + t.id + '">\u2192 Tomorrow</button>';
    }
    if (t.date) {
      out += '<button class="chip" data-action="clear-date" data-id="' + t.id + '">Clear date</button>';
    }
    out += "</div>";
    return out;
  }

  function taskRowHtml(t, indent, showCat) {
    var cls = "task-row" + (indent ? " indent" : "");
    var html = '<div class="' + cls + '" data-action="expand-task" data-id="' + t.id + '">';
    html += '<button class="checkbox' + (t.done ? '' : '') + '" data-action="toggle-task" data-id="' + t.id + '" style="' + (t.done ? "background:var(--coral);border-color:var(--coral);" : "") + '">' + (t.done ? "\u2713" : "") + "</button>";
    html += '<div class="task-body">';
    html += '<div class="task-title-row">';
    if (t.time && !t.done) html += '<span class="time-badge">' + esc(t.time) + "</span>";
    if (t.priority && !t.done) html += '<span>' + PRIORITY_META[t.priority].dot + "</span>";
    if (t.depth && !t.done) html += '<span title="' + DEPTH_META[t.depth].label + '">' + DEPTH_META[t.depth].emoji + "</span>";
    html += '<span class="task-title' + (t.done ? " done" : "") + '">' + esc(t.title) + "</span>";
    html += "</div>";
    if (showCat) {
      var bucketLabel = t.bucket !== "backlog" ? " \u00b7 " + BUCKETS[t.bucket] : "";
      var dateLabel = taskDateStatus(t) === "tomorrow" ? " \u00b7 Tomorrow" : "";
      html += '<div class="meta-row">' + catDot(t.category) + '<span class="meta-txt">' + CATEGORIES[t.category].label + (state.view === "all" ? bucketLabel + dateLabel : "") + "</span></div>";
    }
    html += "</div></div>";
    if (state.expanded === t.id) html += taskActionsHtml(t);
    return html;
  }

  function untaggedSectionHtml() {
    var untagged = sortTasks(openTasks().filter(function (t) {
      return !t.depth && ["today", "tomorrow"].indexOf(effectiveBucket(t)) > -1;
    }));
    if (untagged.length === 0) return "";
    var html = '<div class="cat-head" style="margin-top:18px"><h2 style="color:var(--coral)">\u2757 Untagged \u2014 tag to sort (' + untagged.length + ")</h2></div>";
    html += untagged.map(function (t) { return taskRowHtml(t, false, true); }).join("");
    return html;
  }

  function nowViewHtml() {
    var ctx = getContext();
    var html = "";
    if (!ctx) {
      html += '<div class="banner" style="background:rgba(12,37,69,.05);border:1px solid rgba(12,37,69,.12)">';
      html += '<p class="b-title" style="color:var(--navy)">Not a tagged light/deep window right now</p>';
      var lightCount = openTasks().filter(function (t) { return t.depth === "light" && ["today", "tomorrow"].indexOf(effectiveBucket(t)) > -1; }).length;
      var deepCount = openTasks().filter(function (t) { return t.depth === "deep" && ["today", "tomorrow"].indexOf(effectiveBucket(t)) > -1; }).length;
      html += '<p class="b-body" style="color:var(--ink);opacity:.7">Waiting for you: ' + lightCount + ' light \u2600\uFE0F and ' + deepCount + ' deep \uD83C\uDF19 items queued for today/tomorrow. Here\u2019s Today in the meantime.</p></div>';
      html += flatListHtml("today");
      html += untaggedSectionHtml();
      return html;
    }
    if (ctx.mode === "sabbath") {
      html += '<div class="banner" style="background:rgba(124,92,184,.08);border:1px solid rgba(124,92,184,.3)">';
      html += '<p class="b-title" style="color:var(--purple)">' + ctx.label + "</p>";
      html += '<p class="b-body" style="color:var(--ink);opacity:.7">No task list here on purpose. Rest.</p></div>';
      return html;
    }
    var meta = DEPTH_META[ctx.mode];
    var todayMatches = sortTasks(openTasks().filter(function (t) { return t.depth === ctx.mode && effectiveBucket(t) === "today"; }));
    var items, sourceNote;
    if (todayMatches.length > 0) {
      items = todayMatches;
      sourceNote = "Showing your " + meta.label.toLowerCase() + " items from Today.";
    } else {
      items = sortTasks(openTasks().filter(function (t) { return t.depth === ctx.mode && effectiveBucket(t) === "tomorrow"; }));
      sourceNote = "Nothing in Today, so pulling from Tomorrow instead.";
    }
    html += '<div class="banner" style="background:rgba(0,0,0,.03);border:1px solid ' + meta.color + '55">';
    html += '<p class="b-title" style="color:' + meta.color + '">' + meta.emoji + " " + ctx.label + "</p>";
    html += '<p class="b-body" style="color:var(--ink);opacity:.7">' + sourceNote + "</p></div>";
    if (items.length === 0) {
      html += '<p class="empty">Nothing tagged ' + meta.label + ' in Today or Tomorrow. Check the list below and tag a few.</p>';
    } else {
      html += items.map(function (t) { return taskRowHtml(t, false, true); }).join("");
    }
    html += untaggedSectionHtml();
    return html;
  }

  function flatListHtml(bucket) {
    var items = sortTasks(itemsForBucket(bucket));
    if (items.length === 0) {
      var msg = bucket === "today" ? "Nothing pulled in for today yet. Open All and send something here."
        : bucket === "tomorrow" ? "Nothing scheduled for tomorrow yet. Tap a task, then \u2192 Tomorrow."
        : "Nothing here right now.";
      return '<p class="empty">' + msg + "</p>";
    }
    return items.map(function (t) { return taskRowHtml(t, false, true); }).join("");
  }

  function allViewHtml() {
    var html = "";
    Object.keys(CATEGORIES).forEach(function (catKey) {
      var cat = CATEGORIES[catKey];
      var catTasks = state.tasks.filter(function (t) { return t.category === catKey && !t.done; });
      var parents = catTasks.filter(function (t) { return !t.parentId; });
      html += '<div class="cat-section"><div class="cat-head"><span class="cat-dot" style="background:' + cat.color + ';width:10px;height:10px"></span><h2>' + cat.label + '</h2><span class="n">' + catTasks.length + "</span></div>";
      if (parents.length === 0) {
        html += '<p class="meta-txt" style="opacity:.4;padding-left:2px">' + (catKey === "eskom" ? "Kept light on purpose \u2014 exit-critical items only." : "Nothing captured yet.") + "</p>";
      } else {
        parents.forEach(function (p) {
          html += taskRowHtml(p, false, false);
          catTasks.filter(function (c) { return c.parentId === p.id; }).forEach(function (c) {
            html += taskRowHtml(c, true, false);
          });
        });
      }
      html += "</div>";
    });
    return html;
  }

  function doneViewHtml() {
    var items = state.tasks.filter(function (t) { return t.done; });
    if (items.length === 0) return '<p class="empty">Nothing completed yet \u2014 it\'s coming.</p>';
    return items.map(function (t) { return taskRowHtml(t, false, true); }).join("");
  }

  function goalRowHtml(g) {
    var days = daysUntil(g.deadline);
    var linked = openTasks().filter(function (t) { return t.goalId === g.id; });
    var html = '<div class="goal-row">';
    html += '<div class="task-row" data-action="expand-goal" data-id="' + g.id + '">';
    html += '<button class="checkbox round" data-action="toggle-goal" data-id="' + g.id + '" style="' + (g.done ? "background:" + HORIZONS[g.horizon].color + ";border-color:" + HORIZONS[g.horizon].color + ";" : "") + '">' + (g.done ? "\u2713" : "") + "</button>";
    html += '<div class="task-body">';
    html += '<p class="goal-title' + (g.done ? " done" : "") + '">' + esc(g.title) + "</p>";
    if (g.note && !g.done) html += '<p class="goal-note">' + esc(g.note) + "</p>";
    html += '<div class="meta-row">';
    if (days !== null && !g.done) {
      var soon = days <= 14;
      html += '<span class="goal-days" style="color:' + (soon ? "var(--coral)" : "var(--navy)") + ";background:" + (soon ? "rgba(244,123,106,.12)" : "rgba(12,37,69,.05)") + '">' + (days < 0 ? Math.abs(days) + "d overdue" : days === 0 ? "Today" : days + "d left") + "</span>";
    }
    if (linked.length > 0) html += '<span class="meta-txt">' + linked.length + " linked action" + (linked.length === 1 ? "" : "s") + " \u2014 tap to view</span>";
    html += "</div></div></div>";
    if (state.expanded === g.id) {
      html += '<div style="margin-left:31px">';
      if (linked.length > 0) {
        html += '<ul class="goal-linked">';
        linked.forEach(function (t) { html += "<li>" + esc(t.title) + " (" + BUCKETS[t.bucket] + ")</li>"; });
        html += "</ul>";
      }
      html += '<button class="chip danger" data-action="remove-goal" data-id="' + g.id + '">Remove</button></div>';
    }
    html += "</div>";
    return html;
  }

  function goalsViewHtml() {
    var html = '<p class="goals-intro">The bigger picture your daily list should serve. Ask &ldquo;does this move me toward one of these?&rdquo; \u2014 if not, it may be delete, delegate, defer, or say no.</p>';
    Object.keys(HORIZONS).forEach(function (hKey) {
      var h = HORIZONS[hKey];
      var items = state.goals.filter(function (g) { return g.horizon === hKey && !g.done; })
        .sort(function (a, b) { var da = daysUntil(a.deadline), db = daysUntil(b.deadline); return (da === null ? 9999 : da) - (db === null ? 9999 : db); });
      html += '<div style="margin-bottom:22px"><div class="horizon-head"><span class="cat-dot" style="background:' + h.color + ';width:10px;height:10px"></span><h2>' + h.label + '</h2><span class="sub">' + h.sub + "</span></div>";
      html += items.length === 0 ? '<p class="meta-txt" style="opacity:.4;padding-left:2px">Nothing here.</p>' : items.map(goalRowHtml).join("");
      html += "</div>";
    });
    return html;
  }

  function render() {
    var open = openTasks();
    var todayCount = itemsForBucket("today").length;
    var counts = {};
    Object.keys(BUCKETS).forEach(function (k) { counts[k] = itemsForBucket(k).length; });
    counts.tomorrow = itemsForBucket("tomorrow").length;
    counts.all = open.length;
    counts.done = state.tasks.filter(function (t) { return t.done; }).length;
    counts.goals = state.goals.filter(function (g) { return !g.done; }).length;

    var dateStr = new Date().toLocaleDateString("en-ZA", { weekday: "long", day: "numeric", month: "long" });

    var html = '<div class="header"><p class="date">' + dateStr + '</p><h1 class="title">My Command Centre</h1>';
    html += '<p class="tagline">' + (state.view === "today" && todayCount > 5 ? todayCount + " on today\u2019s plate \u2014 more than 5 focus slots. Worth trimming?" : "Your list serves your priorities \u2014 not the other way round.") + "</p>";
    html += '<button class="link-btn" data-action="toggle-backup">' + (state.showBackup ? "Hide backup" : "Backup / restore my data") + "</button></div>";

    if (state.showBackup) {
      var backupJSON = JSON.stringify({ tasks: state.tasks, goals: state.goals });
      html += '<div class="backup-panel"><h3>Copy this somewhere safe (Notes, email to yourself)</h3>';
      html += '<textarea readonly rows="3" onclick="this.select()">' + esc(backupJSON) + "</textarea>";
      html += '<h3 style="margin-top:12px">Restore from a backup</h3>';
      html += '<textarea id="restoreBox" rows="3" placeholder="Paste a backup here\u2026">' + esc(state.restoreText) + "</textarea>";
      if (state.restoreError) html += '<p class="backup-err">' + esc(state.restoreError) + "</p>";
      html += '<button class="chip" style="margin-top:8px;background:var(--navy);color:white;border:none" data-action="restore-backup">Restore</button></div>';
    }

    html += '<div class="tabs">';
    TABS.forEach(function (tab) {
      var key = tab[0], label = tab[1];
      html += '<button class="tab' + (state.view === key ? " active" : "") + '" data-action="set-view" data-view="' + key + '">' + label;
      if (counts[key] > 0) html += '<span class="count">' + counts[key] + "</span>";
      html += "</button>";
    });
    html += "</div>";

    html += '<div class="body">';
    if (state.loadError) {
      html += '<div class="banner err"><p class="b-title">\u26A0\uFE0F Couldn\u2019t load your saved data</p><p class="b-body">Showing the starter list. If you have a backup copy, restore it above. Error: ' + esc(state.loadError) + "</p></div>";
    }
    if (state.view === "now") html += nowViewHtml();
    else if (state.view === "all") html += allViewHtml();
    else if (state.view === "done") html += doneViewHtml();
    else if (state.view === "goals") html += goalsViewHtml();
    else html += flatListHtml(state.view);
    html += "</div>";

    html += '<div class="capture-bar">';
    if (state.showAdd) {
      html += '<div class="capture-row"><input id="titleInput" type="text" placeholder="' + (state.view === "goals" ? "Add a goal\u2026" : state.view === "tomorrow" ? "Add for tomorrow\u2026" : "Capture a task\u2026") + '" value="' + esc(state.newTitle) + '"><button class="add" data-action="add-item">Add</button></div>';
      html += '<div class="chip-row">';
      if (state.view === "goals") {
        Object.keys(HORIZONS).forEach(function (key) {
          var h = HORIZONS[key];
          var active = state.newHorizon === key;
          html += '<button class="cat-chip" data-action="set-horizon" data-horizon="' + key + '" style="' + (active ? "background:" + h.color + ";color:white" : "background:rgba(0,0,0,.05);color:" + h.color) + '">' + h.label + "</button>";
        });
      } else {
        Object.keys(CATEGORIES).forEach(function (key) {
          var c = CATEGORIES[key];
          var active = state.newCat === key;
          html += '<button class="cat-chip" data-action="set-cat" data-cat="' + key + '" style="' + (active ? "background:" + c.color + ";color:white" : "background:rgba(0,0,0,.05);color:" + c.color) + '">' + c.label + "</button>";
        });
      }
      html += '<button class="close-chip" data-action="close-add">Close</button></div>';
    } else {
      html += '<div class="capture-toggle-row"><button class="capture-toggle" data-action="open-add">+ ' + (state.view === "goals" ? "Add a goal" : "Capture a task") + "</button>";
      var si = state.saveState === "saving" ? "Saving\u2026" : state.saveState === "saved" ? "Saved \u2713" : state.saveState === "error" ? "\u26A0\uFE0F Not saved \u2014 tap to retry" : "";
      html += '<button class="save-indicator" data-action="retry-save" style="color:' + (state.saveState === "error" ? "#DC2626" : "rgba(30,42,58,.5)") + '">' + si + "</button></div>";
    }
    html += "</div>";

    document.getElementById("app").innerHTML = html;

    var titleInput = document.getElementById("titleInput");
    if (titleInput) {
      titleInput.focus();
      titleInput.selectionStart = titleInput.selectionEnd = titleInput.value.length;
      titleInput.addEventListener("input", function (e) { state.newTitle = e.target.value; });
      titleInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { state.view === "goals" ? addGoal() : addTask(); }
      });
    }
    var restoreBox = document.getElementById("restoreBox");
    if (restoreBox) restoreBox.addEventListener("input", function (e) { state.restoreText = e.target.value; });
  }

  // ---------- event delegation ----------
  document.getElementById("app").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if (action === "toggle-task") { e.stopPropagation(); toggleDone(id); return; }
    if (action === "expand-task") { state.expanded = state.expanded === id ? null : id; render(); return; }
    if (action === "move-task") { patchTask(id, { bucket: el.getAttribute("data-bucket") }); state.expanded = null; render(); return; }
    if (action === "cycle-priority") { cyclePriority(id); return; }
    if (action === "cycle-goal") { cycleGoal(id); return; }
    if (action === "cycle-depth") { cycleDepth(id); return; }
    if (action === "cycle-category") { cycleCategory(id); return; }
    if (action === "schedule-tomorrow") { scheduleTomorrow(id); return; }
    if (action === "clear-date") { clearDate(id); return; }
    if (action === "delete-task") { removeTask(id); return; }
    if (action === "toggle-goal") { e.stopPropagation(); toggleGoalDone(id); return; }
    if (action === "expand-goal") { state.expanded = state.expanded === id ? null : id; render(); return; }
    if (action === "remove-goal") { removeGoal(id); return; }
    if (action === "set-view") { state.view = el.getAttribute("data-view"); state.expanded = null; render(); return; }
    if (action === "toggle-backup") { state.showBackup = !state.showBackup; render(); return; }
    if (action === "restore-backup") { restoreBackup(); return; }
    if (action === "retry-save") { save(); return; }
    if (action === "open-add") { state.showAdd = true; render(); return; }
    if (action === "close-add") { state.showAdd = false; render(); return; }
    if (action === "add-item") { state.view === "goals" ? addGoal() : addTask(); return; }
    if (action === "set-cat") { state.newCat = el.getAttribute("data-cat"); render(); return; }
    if (action === "set-horizon") { state.newHorizon = el.getAttribute("data-horizon"); render(); return; }
  });

  // ---------- boot ----------
  load();
  render();
})();
</script>
</body>
</html>
